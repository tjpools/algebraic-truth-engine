[package]
name = "algebraic-truth-engine"
version = "0.1.0"
edition = "2021"
description = "A symbolic algebraic calculator that returns mathematical truths"
authors = ["Mathematical Consciousness Explorer"]

[dependencies]
# For mathematical operations and number theory
num = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-complex = { version = "0.4", features = ["serde"] }

# For parsing mathematical expressions
pest = "2.7"
pest_derive = "2.7"

# For enhanced algebraic operations
nalgebra = "0.32"

# For better error handling
anyhow = "1.0"
thiserror = "1.0"

# For serialization (saving/loading expressions)
serde = { version = "1.0", features = ["derive"] }
